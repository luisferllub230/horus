version: '3.8'

services:
  odoo-panel:
    build: .
    container_name: horus-panel
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/app
    environment:
      - CONTAINER_FILTER=
      - PANEL_PORT=5000
      - SERVER_HOST=127.0.1.1
      
    restart: unless-stopped
    networks:
      - horus-network

networks:
  horus-network:
    external: false